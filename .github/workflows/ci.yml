name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow"
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd app/LocalVoice && xcodegen generate && xcodebuild -project LocalVoice.xcodeproj -scheme LocalVoice -destination 'platform=macOS' test
